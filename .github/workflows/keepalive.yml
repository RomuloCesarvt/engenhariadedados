name: Manter engine acordada (Render gratuito)

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Acessar /health da engine
        run: curl -fsS --max-time 60 --retry 3 --retry-delay 10 https://engenhariadedados-engine.onrender.com/health
