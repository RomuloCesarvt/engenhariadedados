name: Reconciliação Sob Demanda de Leads

on:
  repository_dispatch:
    types: [trigger_reconciliation]
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Data Inicial (YYYY-MM-DD)'
        required: false
        default: ''
      end_date:
        description: 'Data Final (YYYY-MM-DD)'
        required: false
        default: ''

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r engine/requirements.txt

      - name: Executar Testes Unitários (pytest)
        run: |
          pytest engine/tests/

      - name: Executar Engine de Reconciliação Sob Demanda
        env:
          FIREBASE_CREDENTIALS_PATH: ${{ secrets.FIREBASE_CREDENTIALS_PATH }}
        run: |
          python engine/main.py --start-date "${{ github.event.inputs.start_date }}" --end-date "${{ github.event.inputs.end_date }}"

      - name: Upload Relatórios como Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reconciliation-reports
          path: output/
