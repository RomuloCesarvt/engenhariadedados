name: Reconciliação Sob Demanda de Leads

on:
  repository_dispatch:
    types: [trigger_reconciliation]
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Data Inicial (YYYY-MM-DD)'
        required: false
        default: ''
      end_date:
        description: 'Data Final (YYYY-MM-DD)'
        required: false
        default: ''

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r engine/requirements.txt

      - name: Executar Testes Unitários (pytest)
        run: |
          pytest engine/tests/

      - name: Executar Engine de Reconciliação Sob Demanda
        env:
          CV_CRM_URL: ${{ secrets.CV_CRM_URL }}
          CV_CRM_EMAIL: ${{ secrets.CV_CRM_EMAIL }}
          CV_CRM_TOKEN: ${{ secrets.CV_CRM_TOKEN }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          RD_STATION_API_TOKEN: ${{ secrets.RD_STATION_API_TOKEN }}
          RD_STATION_CLIENT_ID: ${{ secrets.RD_STATION_CLIENT_ID }}
          RD_STATION_CLIENT_SECRET: ${{ secrets.RD_STATION_CLIENT_SECRET }}
          RD_STATION_REFRESH_TOKEN: ${{ secrets.RD_STATION_REFRESH_TOKEN }}
          BEEVIRAL_API_KEY: ${{ secrets.BEEVIRAL_API_KEY }}
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
          FIREBASE_CREDENTIALS_PATH: ${{ secrets.FIREBASE_CREDENTIALS_PATH }}
        run: |
          python engine/main.py --start-date "${{ github.event.inputs.start_date }}" --end-date "${{ github.event.inputs.end_date }}"

      - name: Upload Relatórios como Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reconciliation-reports
          path: output/
